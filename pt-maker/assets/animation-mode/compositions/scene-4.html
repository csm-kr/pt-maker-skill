<template id="scene-4-template">

      <div class="before-card" id="s4-before">
        <p class="state-label">BEFORE</p>
        <p class="state-copy">페이지가<br>따로 노는<br>자료</p>
      </div>
      <div class="after-card" id="s4-after">

      </div>
    </div>
    <script>
      const scene4Tl = gsap.timeline({ paused: true });

      scene4Tl.from("#s4-after", { x: 86, opacity: 0, duration: .82, ease: "power3.out" }, .48);

      window.__timelines["scene-4"] = scene4Tl;

    <div class="world world--plain"></div>
    <p class="statement" id="s1-statement" style="top:120px;">가운데, <span class="hl">관계<i class="hl-bar" id="s1-hl" aria-hidden="true"></i></span>가 핵심이에요</p>

    <div class="sticker" id="s1-class" data-xywh="0.0719 0.3148 0.1563 0.2778" style="left:138px; top:340px; width:300px; height:300px;">

      <path class="b1" d="M1067.5 325.5 A215 190 0 0 1 852.5 654.5 A215 190 0 1 1 1124.7 367.8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>

    <script>
      const s1T = { first: .25, second: .95, third: 1.65, circle: 2.5, statement: 3.5, highlight: 3.75, end: 5.5 };
      const scene1Tl = gsap.timeline({ paused: true });
      [["#s1-class", s1T.first], ["#s1-relation", s1T.second], ["#s1-instance", s1T.third]].forEach(([id, at]) => {
        scene1Tl.from(id, { scale: .6, opacity: 0, duration: .26, ease: "power3.out" }, at);
        scene1Tl.from(id + "-label", { y: 14, opacity: 0, duration: .2, ease: "power3.out" }, at + .08);

      scene1Tl.from("#s1-statement", { opacity: 0, duration: .01 }, s1T.statement);
      scene1Tl.from("#s1-hl", { scaleX: 0, duration: .4, ease: "power1.out" }, s1T.highlight);
      scene1Tl.set({}, {}, s1T.end);
      window.__timelines["scene-1"] = scene1Tl;

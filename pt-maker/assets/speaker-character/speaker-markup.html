     - 붙여 넣은 뒤 "sN-"을 장면 접두어(s3- 등)로 모두 바꾼다: root id, 망점 pattern id, fill="url(#...)" 참조.
     - --spk-x/--spk-y는 1920×1080 프레임 기준 좌상단 px, --spk-w는 폭 px.
     - data-pose: 정지 포즈(smile | o | wave | side | think). 타임라인 t=0도 이 포즈에서 시작한다.
     - 대사는 쓸 줄 수만큼 <p class="spk-bubble">을 둔다. 정지 포즈에 남길 한 줄에만 is-rest를 붙인다.
     - spk--plain: 머리 위 굵은 글자(paper-motion 기본). 빼면 상자 말풍선(spk--bubble-left/right로 방향). -->
